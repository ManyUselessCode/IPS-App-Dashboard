<script src="/icons.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #raster {
    box-sizing: border-box;
    height: 100%;
    overflow-y: auto;
    padding: 34px 4px 4px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    align-content: start;
  }
  .raum {
    position: relative;
    box-sizing: border-box;
    min-height: 118px;
    padding: 14px 6px 12px;
    border: 1px solid rgba(127, 127, 127, 0.25);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s;
  }
  .raum:active { background-color: rgba(127, 127, 127, 0.12); }
  .icon { font-size: 30px; color: #03A9F4; margin-bottom: 4px; }
  .name { font-size: 15px; font-weight: 500; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
  .info { position: absolute; top: 9px; left: 12px; font-size: 12px; opacity: 0.6; }
  @media (min-width: 600px) {
    #raster { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
</style>
<div id="raster"></div>
<script>
  function zeichnen(raeume) {
    const raster = document.getElementById('raster');
    raster.textContent = '';
    for (const raum of raeume) {
      const kachel = document.createElement('div');
      kachel.className = 'raum';
      kachel.addEventListener('click', () => openObject(raum.id));

      const icon = document.createElement('i');
      icon.className = 'icon fa-light fa-' + raum.icon;
      kachel.appendChild(icon);

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = raum.name;
      kachel.appendChild(name);

      if (raum.info !== '') {
        const info = document.createElement('div');
        info.className = 'info';
        info.textContent = raum.info;
        kachel.appendChild(info);
      }
      raster.appendChild(kachel);
    }
  }

  function handleMessage(daten) {
    zeichnen(typeof daten === 'string' ? JSON.parse(daten) : daten);
  }

  zeichnen(/*DATEN*/null || []);
</script>

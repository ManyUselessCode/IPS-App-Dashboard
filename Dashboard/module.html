<script src="/icons.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #raster {
    box-sizing: border-box;
    height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    padding: 44px 4px 8px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    align-content: start;
  }
  .raum {
    position: relative;
    box-sizing: border-box;
    min-height: 136px;
    padding: 28px 8px 16px;
    border-radius: 18px;
    background: rgba(120, 120, 128, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    outline: none;
    /* Loslassen: weich zurück, ohne Überschwingen */
    transition: transform 320ms cubic-bezier(0.25, 1, 0.5, 1), background-color 200ms ease;
  }
  @media (hover: hover) {
    .raum:hover { background: rgba(120, 120, 128, 0.12); }
  }
  /* Drücken: sofort, beim Berühren und nicht erst beim Loslassen */
  .raum.gedrueckt {
    transform: scale(0.96);
    background: rgba(120, 120, 128, 0.16);
    transition: transform 90ms ease-out, background-color 90ms ease-out;
  }
  .raum:focus-visible { box-shadow: 0 0 0 3px rgba(3, 169, 244, 0.5); }
  .kreis {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(3, 169, 244, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon { font-size: 30px; color: #03A9F4; }
  .name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
    text-align: center;
    overflow-wrap: anywhere;
  }
  .info {
    position: absolute;
    top: 11px;
    left: 13px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    opacity: 0.6;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .info i { font-size: 12px; }
  @media (min-width: 600px) {
    #raster { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .raum, .raum.gedrueckt { transform: none; transition: background-color 150ms ease; }
  }
</style>
<div id="raster"></div>
<script>
  const SCHWELLE = 10; // ab so viel Bewegung ist es Scrollen, kein Tippen

  function kachelBauen(raum) {
    const kachel = document.createElement('div');
    kachel.className = 'raum';
    kachel.setAttribute('role', 'button');
    kachel.tabIndex = 0;
    kachel.setAttribute('aria-label', raum.info !== '' ? raum.name + ', ' + raum.info : raum.name);

    let start = null;
    let abgebrochen = false;
    kachel.addEventListener('pointerdown', (e) => {
      start = { x: e.clientX, y: e.clientY };
      abgebrochen = false;
      kachel.classList.add('gedrueckt');
    });
    kachel.addEventListener('pointermove', (e) => {
      if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > SCHWELLE) {
        abgebrochen = true;
        kachel.classList.remove('gedrueckt');
      }
    });
    for (const ende of ['pointerup', 'pointercancel', 'pointerleave']) {
      kachel.addEventListener(ende, () => {
        start = null;
        kachel.classList.remove('gedrueckt');
      });
    }
    kachel.addEventListener('click', () => {
      if (!abgebrochen) {
        openObject(raum.id);
      }
    });
    kachel.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openObject(raum.id);
      }
    });

    const kreis = document.createElement('div');
    kreis.className = 'kreis';
    const icon = document.createElement('i');
    icon.className = 'icon fa-light fa-' + raum.icon;
    kreis.appendChild(icon);
    kachel.appendChild(kreis);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = raum.name;
    kachel.appendChild(name);

    if (raum.info !== '') {
      const info = document.createElement('div');
      info.className = 'info';
      const thermometer = document.createElement('i');
      thermometer.className = 'fa-light fa-temperature-half';
      info.appendChild(thermometer);
      info.appendChild(document.createTextNode(raum.info));
      kachel.appendChild(info);
    }
    return kachel;
  }

  function zeichnen(raeume) {
    const raster = document.getElementById('raster');
    raster.textContent = '';
    for (const raum of raeume) {
      raster.appendChild(kachelBauen(raum));
    }
  }

  function handleMessage(daten) {
    zeichnen(typeof daten === 'string' ? JSON.parse(daten) : daten);
  }

  zeichnen(/*DATEN*/null || []);
</script>
